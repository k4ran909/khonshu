version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khonshu-bot
    restart: unless-stopped
    environment:
      - TOKEN=${TOKEN}
      - OWNER=${OWNER}
      - PREFIX=${PREFIX}
      - YOUTUBE_COOKIES=${YOUTUBE_COOKIES}
      - ALLOWED=${ALLOWED}
      - LAVALINK_HOST=khonshu-lavalink
      - LAVALINK_PORT=19133
      - LAVALINK_PASSWORD=RavenLava_19133
      - HTTP_PROXY=http://khonshu-warp:1080
      - HTTPS_PROXY=http://khonshu-warp:1080
      - NO_PROXY=khonshu-lavalink,localhost,127.0.0.1

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    container_name: khonshu-lavalink
    restart: unless-stopped
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
      - TZ=UTC
      - HTTPCONFIG_PROXYHOST=khonshu-warp
      - HTTPCONFIG_PROXYPORT=1080
      - PLUGINS_YOUTUBE_HTTPCONFIG_PROXYHOST=khonshu-warp
      - PLUGINS_YOUTUBE_HTTPCONFIG_PROXYPORT=1080
      - LAVALINK_SERVER_SOURCES_HTTP_PROXYHOST=khonshu-warp
      - LAVALINK_SERVER_SOURCES_HTTP_PROXYPORT=1080

  warp:
    image: caomingjun/warp:latest
    container_name: khonshu-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp-data:/var/lib/cloudflare-warp

volumes:
  warp-data:
